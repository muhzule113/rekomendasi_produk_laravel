services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5002}:80"
    volumes:
      - ./storage/app:/var/www/html/storage/app
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: db_sinar_manis
      DB_USERNAME: root
      DB_PASSWORD: root123
      APP_KEY: base64:soRfK2CQihZMkUBnMjL0JILQd+bsULcetA91bca1zVk=
    depends_on:
      mysql:
        condition: service_healthy

  queue:
    build: .
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./storage/app:/var/www/html/storage/app
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: db_sinar_manis
      DB_USERNAME: root
      DB_PASSWORD: root123
      APP_KEY: base64:soRfK2CQihZMkUBnMjL0JILQd+bsULcetA91bca1zVk=
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: db_sinar_manis
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - rekomendasi-produk_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  rekomendasi-produk_db_data:
    external: true
